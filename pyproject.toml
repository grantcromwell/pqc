[project]
name = "qprotect"
version = "0.2.0"
description = "Post-quantum multi-recipient envelope and guarded LUKS2 planning prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.5",
]
authors = [{ name = "qprotect maintainers" }]
license = { text = "Proprietary" }

[project.scripts]
qprotect = "qprotect.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qprotect"]
